; EDF6VehicleCrew 设置。游戏运行中改完保存，约 1 秒内自动生效（不用重启），每一项都可以这样热改。
; 日志：同目录 EDF6VehicleCrew.log（超过 32 MB 时改名为 EDF6VehicleCrew.log.1 再写新的）
; 每项数值读入时都会检查范围：超出范围（例如负的毫秒数）会被改成最近的合法值，并在日志里写一行 CONFIG ... out of range
; 升级时安装器只补进新版本新增的项（带默认值和说明），你已有的值和注释原样保留。
[VehicleCrew]
; 总开关
Enabled=1
; 1 = 日志里每 5 秒打印每台载具的座位状态、每秒打印直升机飞控数据，联机时每秒记录每架飞机的联机状态（NET 行）。默认开着，方便测试时回传日志；嫌日志大可以改成 0
Debug=1

; ---- NPC 自动上车 ----
; 1 = 玩家驾驶过并下车的己方空载具会来一名 NPC 驾驶；首次停放的空车始终等玩家，任务原有 NPC 不受影响。
AutoCrew=1
; 载具空着多少毫秒后才派 NPC（玩家刚下车/刚把 NPC 顶下来时也重新计时）。0~600000
CrewDelayMs=3000
; 只给离玩家这么多米以内的载具派 NPC；0 = 不限距离
CrewRange=600

; ---- 玩家顶替 NPC ----
; 1 = 玩家可以上 NPC 正坐着的座位（提示照常出现，按上车键就顶掉）
Bump=1
; 1 = 被顶下的 NPC 挪到空的副座/炮手位；没有空位才下车（下车的 NPC 会消失）
BumpToGunner=1

; ---- 直升机驾驶 ----
; 游戏本身没有直升机驾驶 AI，NPC 坐上直升机后由本插件来飞。只接管本插件派了 NPC 的直升机。
HeliPilot=1
; 悬停在玩家头顶多高（米）
HeliHeight=35
; 没敌人时：玩家站着，直升机以这个半径（米）绕玩家盘旋，多架按 360°/架数均匀分布；
; 玩家在走动，直升机在玩家行进方向的侧前方这么远处排 V 字护航
HeliFollow=45
; 攻击这个距离内的敌人（米）。打法是扫射航线：在目标上方 HeliFireHeight 米全速冲过去，160 米内（506 是 150 米）
; 压机头瞄准开火、靠惯性滑进去；机头要压过 30° 时从目标旁边冲过去，飞出 140 米再转回来下一轮。
; 火线会穿过玩家时绕着目标横移开。409 的机炮在炮塔上，70 米内对下方的敌人自己就开火；409 的火箭弹是直射的，
; 只在机头对准（3°）时、250 米内发射；506 的导弹会追踪。弹药打空后过一会儿自动补满（机炮 8 秒、导弹/火箭 15 秒），
; 机炮每次连射 2 秒歇 1 秒
HeliRange=350
; 有敌人时的活动范围（米）：玩家步行时，交战的直升机离玩家不超过这么远（没敌人时的范围就是上面的 HeliFollow）。
; 只去打从这个圈里够得着的敌人（本圈半径 + 机枪射程以内）。玩家自己开直升机时不受限。
; 不能大于 HeliRange（大于时按 HeliRange 处理并写日志）
HeliCombatRange=120
; 1 = 开火（机枪对准就打；不会隔着玩家开火）
HeliFire=1
; 1 = 也发射导弹
HeliMissile=1
; 两发导弹最短间隔（毫秒）
HeliMissileMs=4000
; 机头（含俯仰）偏离目标提前量点多少度以内才开火（近距离按目标处 3 米脱靶量自动放宽）。导弹会追踪，偏 10 度内就发
HeliFireCone=4
; 扫射时在目标上方多少米。越高越早到 30° 脱离、每轮开火越短；地图有高楼时调高
HeliFireHeight=25
; 避障：用游戏自己的地图射线检测地形和建筑（不检测敌人和友军）。前方有墙会减速、往空的一侧绕、爬到楼顶以上，
; 始终离地至少 6 米（降落除外）。1 = 开，0 = 关
HeliAvoid=1
; 毫秒数（默认 5000）= 打开降落：玩家原地站这么久、且玩家周围 HeliRange 米内也已这么久没有敌人时，降落到玩家身边约
; 20 米处（方便走过去把 NPC 顶下来自己开）；落地后玩家在 25 米内它就不起飞，有敌人靠近立刻起飞。
; 0 = 从不自己降落：附近没有敌人时，玩家站着它就绕玩家盘旋，玩家走动它就护航跟随。
HeliLandMs=5000

; ---- 直升机性能（插件驾驶的直升机）----
; 满杆速度（米/秒）。原版 Eros 约 17-18，Nereid、Brute 更慢。0 或低于原版 = 用原版速度
HeliSpeed=25
; 加速到满速的快慢（秒，越小越灵活）。原版约 13 秒。0.5~60
HeliAgility=4
; ---- 玩家自己开原版直升机（风神、布鲁特等）的悬停辅助 ----
; 松开摇杆后，水平速度衰减到停住的时间常数（秒，同时也是推杆加速到满速的快慢）。原版约 13 秒，松杆后会一直滑行；
; 默认 1 秒：松杆约 1 秒就悬停住。最高速度保持原版不变；本身比这个更稳的机型不改。0 = 原版手感。0~10
PlayerHeliStopSec=1
; 1 = 玩家自己开 / 坐炮位的原版直升机（风神 506、Nereid 409、布鲁特 410 的门炮、602 等）用插件自己的瞄准具：
;     机炮：炮口方向的小十字、按炮弹真实弹道（弹速、下坠、寿命）算出的弹着圈（打到地面 / 建筑的位置，旁边标距离；
;     射程内打不到地面时，弹着圈画在炮弹寿命结束的位置并变暗），409 没有红线的炮塔机炮也画；
;     导弹：锁定框（黄色方框收缩 = 锁定中，红色菱形 = 已锁定，MSL 距离），没锁定时导弹方向的暗色圆环（MSL 锁定距离）；
;     火箭（409）：按游戏真实的飞法（先滑行下坠再点火加速）算出的落点画空心菱形（RKT 距离）。同时隐藏原版那条红色瞄准线；
;     0 = 照原版显示红线、不画瞄准具
PlayerHeliGunSight=1
; 1 = 玩家驾驶 / 坐炮位的其余原版载具（坦克、Titan、Grape、Depth Crawler、机甲、摩托、防空车、Naegling / 喀秋莎 / 榴弹炮等）用插件自己的 HUD：
;     每件武器按真实弹道算的弹着点（炮 = 弹着圈，榴弹 / 高弧 = 黄色十字，火箭 = 菱形，导弹 = 锁定框）、顶部航向带、
;     屏幕下方的车体 / 炮塔指示、速度、HP、各武器弹数与装填、告警，并隐藏玩家座位的原版红色瞄准线；
;     0 = 照原版（红线恢复，不画这套 HUD）
StockVehicleHud=1
; 1 = 原版左侧的武器栏（每件座位武器一块：机炮（左）/（右）、导弹、FUEL 油箱……）在插件 HUD 列出这台载具武器时不再显示：
;     插件战机 / 旋翼机（下方一行 THR、FUEL、挂载与余量）、StockVehicleHud 覆盖的原版载具（左下块里每件武器一行）、
;     开 HeliFlightHud 的原版直升机（底行挂载）。燃料改在插件 HUD 里显示（FUEL 百分比，燃料消耗快到 100 分钟内用完时加剩余时间；
;     低于 15% 或 60 秒内用完时告警灯板亮 LOW FUEL）。插件 HUD 画不出文字时、下车步行、插件 HUD 不覆盖的载具照旧显示原版武器栏；
;     原版的护甲 / 载具耐久条照旧保留（它和你自己的护甲是同一块仪表）。不影响开火。0 = 一直显示原版武器栏
HideStockGauges=1
; 鼠标瞄准飞行（键鼠开原版直升机、空中航母、自爆 / 人偶无人机时；手柄不受影响）：鼠标移动一个以地面为参照的瞄准点（同战斗机，
; 青色方框），机头自己转过去；瞄准点往上 = 爬升、往下 = 下降（前进越快越陡，悬停时只是缓慢升降），水平 ±3° 内保持高度；
; W / S 调前进速度设定，松开后保持（S 一次最多减到 0 = 悬停，再按才倒飞）；A / D 平移；空格上升、Ctrl（PlayerJetBrakeKey）下降，
; 松开保持高度；全部松开 = 保持高度、按设定速度飞（0 = 停住悬停）。方向跟 PlayerJetInvertPitch，速度跟 PlayerJetMouseSpeed。
; 0 = 原版操作（旋翼机是原来的 W/S/A/D + 鼠标转机头）。默认 1。（取代旧的 HeliMousePitch，旧 ini 里那一项不再读取）
HeliMouseAim=1
; 玩家驾驶旋翼机（空中航母、自爆 / 人偶无人机）时的升降加速度倍数（0~4）。升降有自己的加速度，不再和前后左右共用机种的推力（空中航母 4 m/s²：刹车时按上升几乎升不起来）。基准 = 原版直升机满油门超出悬停的加速度 24.2 m/s² × (10 t / 机重)^(1/3)，不超过原版直升机：空中航母（120 t）约 10.6 m/s²，无人机 24.2 m/s²。0 = 和 NPC 一样与推力共用。NPC 驾驶的不受影响。默认 1.0
PlayerRotorLift=1.0
; 直升机 HUD（驾驶原版直升机或旋翼机时）：地平线 / 俯仰梯、航向带、速度框（下面是速度设定）和高度框（下面是爬升率），
; 前进时速度矢量、悬停时漂移指示（箭头 = 漂移方向，圆圈边 = 5 m/s），离地 30 米以下的离地高度条，威胁方向圆环，
; 屏幕下方只留两行（速度设定、保持高度；挂载）和需要时的告警 / 起飞提示。
; 0 = 原版直升机用旧的起飞面板、旋翼机用战斗机座舱（鼠标瞄准飞行的青色方框照画）。默认 1
HeliFlightHud=1
; 最低转向速度（度/秒）。原版 Eros 40、Nereid 23、Brute 15；比这个慢的会被提到这个值
HeliYawRate=50
; Brute（410）的左右门炮由插件自动瞄准、开火，炮手座位没人也会打；玩家坐的那门炮仍归玩家
HeliDoorGuns=1
; 玩家坐救护直升机（空袭兵「救护直升机」呼叫）的门炮位时，门炮自动瞄准射程内受伤的队友（伤得越重越优先），
; 开火仍由玩家按键；没有伤员时照常手动瞄准。0 = 全程手动瞄准。默认 1
MedicGunnerAim=1
; 守点直升机（空袭兵「守点」呼叫来的 Brute）绕呼叫标记盘旋的半径（米），机头沿圆周、门炮朝内；
; 多架守同一点时在圆上均匀错开。交战时 Brute 的盘旋圆心移向目标（目标落在圆内半径一半处，门炮够得着），
; 打完回到标记上空继续绕；506/409 守点时仍是扫射航线，打完回到盘旋。0 = 旧行为：悬停在标记上空
HeliGuardRadius=120
; 守点盘旋速度（米/秒），最多取满杆速度的 80%
HeliGuardSpeed=12

; ---- 战斗机（测试场 / 空袭接管 / 空袭兵呼叫来的插件喷气机）----
; 由插件驾驶战斗机：巡逻、俯冲扫射、导弹、空战
JetPilot=1
; 燃料：升空多少秒后返航撤离（弹药打光或血量低于 25% 也会撤离）
JetFuelSec=120
; 软边界：插件的 NPC 战机 / 直升机在地图边界（战机：±2.4 km，大地图为地面边缘；直升机还取任务移动区域）内侧留一圈缓冲带，
; 一般不会飞进去：快到时提前按自己的转弯半径掉头，追场外的敌人也只追到这里；万一越过就先飞回来（离软边界 150 米以内不再追场外目标）。
; 战机缓冲带宽度（米）：至少这么宽，0~3000，默认 600
AirSoftEdge=600
; ……还至少是该机型满速转弯直径的多少倍（实际宽度取两者较大；地图太小放不下时自动收窄），0~3，默认 1
AirSoftTurns=1
; 战机的软天花板：天花板下方多少米开始压平，0~1000，默认 150
AirSoftCeil=150
; 直升机缓冲带宽度（米），实际至少是满速刹停的距离，0~1000，默认 150
HeliSoftEdge=150
; ---- 空袭接管（需要安装器生成的战斗机 SGO，开发者也可运行 tools/make_jets.py；没有它就保持原版）----
; 空袭兵呼叫轰炸机类支援时，改派插件驾驶的真战斗机（能被击落）；
; 空袭兵的呼叫武器（tools/call_weapons.py 安装的 EDF6VC_CALL_*）也靠这项生效，关掉就照原版 KM6 轰炸机来
JetAirRaider=1
; 任务脚本里的低空扫射飞机（RM034、M116、M118 等）换成真战斗机
JetMissionStrike=1
; 空袭兵的投掷式无人机（机械化炸弹列表里的 EDF6VC_CALL_THROW_*：自爆 / 人偶 / 小型固定翼）：炸弹落地后变成插件的无人机；
; 关掉就照原版巡逻炸弹
ThrowDrones=1
; 空袭派来的战斗机在场多少秒后返航
JetSortieSec=60

; ---- 地面载具（深渊爬行者 502；格雷普斯装甲车只需上面的 AutoCrew，原版自带 AI）----
; 深渊爬行者原版没有 AI，NPC 坐上去不会动；开启后由插件驾驶：没敌人时跟随玩家，有敌人时转身、逼近、开火
GroundPilot=1
; 没有敌人时停在离玩家多少米处
GroundFollow=20
; 多远以内的敌人会去打（米）
GroundRange=200
; 有玩家可跟时，离玩家最多多少米（追敌人也不超过这个距离）。不能小于 GroundFollow（小于时按 GroundFollow 处理）
GroundLeash=100
; 是否自动开火（机炮和左右臂炮）
GroundFire=1

; ---- 海上救援（需要场上有潜水母舰）----
; 玩家步行落海（高度低于 RescueBelow 持续 1.5 秒）时，从最近的潜水母舰甲板上空放出一架布鲁特（410）来接：
; 飞到玩家身边，降到让侧门座位正好在玩家头顶，悬停等待。玩家自己按上车键坐进侧门座位后，
; 运回潜水母舰甲板上空约 8 米悬停，玩家自己跳下去即可，跳下后直升机自行离开。
; 插件绝不移动玩家：不瞬移、不写坐标、不从远处把人拉进座位；上车只走游戏原版的上车判定和距离。
; 同一时间最多一架；120 秒内没人上车、玩家自己上岸或上了别的载具会取消，30 秒后可再次触发。
; 需要 EDF6VC_HELI_410.SGO 已安装且本关预载；没有潜水母舰时不救援（日志里会说明）
SeaRescue=1
; 玩家高度低于多少算落海（米，海面约为 0）
RescueBelow=-5.0
; 侧门座位到达原版上车距离内时，是否由插件替玩家按上车键（走原版上车流程，只会坐空着的侧门座位，
; 距离不够时不会上车）。1 = 开（默认）；0 = 关闭，悬停等玩家自己按上车键
RescueAutoBoard=1

; ---- 登车狙击枪（调试用；游击兵的狙击枪 EDF6VC_CALL_BOARDING_GUN，安装器写入：子弹瞬间到达、无散布、999 发、1 帧换弹）----
; 用它打中己方载具：子弹穿过不造成伤害，玩家立刻坐进那台载具（优先驾驶座；NPC 驾驶的，NPC 挪到副座或下车）。
; 0 = 关闭（子弹照普通狙击枪打中载具）
BoardingGun=1

; ---- 潜水母舰：船体 + 子系统 ----
; 潜舰 HP 拆成「船体」和 4 个甲板子系统（左舷炮塔 A、炮塔 B 各 6000，导弹舱 5000，艉部无人机舱 5000）。
; 打在子系统附近甲板上的伤害只扣该子系统；子系统打坏后失去功能（炮塔停火 / 导弹停射 / 不再放无人机），
; 90 秒后船员修好回满。每个子系统在自己位置上方有一条小血条，船体血条仍在指挥塔上方。
; 船体只吃重型攻击：母舰主炮（Genocide）和运兵船的传送门激光；其它攻击打在船体上一律不掉血。
; 船体 HP（SGO 里是 30000，出生时按比例改成这个值；若机体带档位倍率，这个值和甲板子系统的 HP 一起乘它）。0 = 用游戏算出的值
SubHullHp=100000
; 认不出来源时的兜底：打在船体上的单发伤害达到这个值也算重型攻击（0 = 只认母舰主炮和运兵船）
SubHeavyHit=1500

; ---- 载具状态显示（HUD）----
; 离玩家 VehicleHudRange 米以内、由 NPC 驾驶的友军载具（直升机、喷气机、无人机、空母、爬行者等），取最近的
; VehicleHudCount 台，在它头顶显示一行状态和一条血条：「机种 血量%  G 机炮余弹  M 导弹余数  D 剩余无人机出击
; F 剩余燃料(分:秒)」。没有该武器的不显示对应项；燃料只对插件限时的显示（喷气机、呼叫来的直升机），撤离时显示 RTB。
; 潜水母舰另在屏幕右侧显示自己的面板（深蓝底、青色边）：船体大血条和数值，4 个子系统各一条，被打坏时显示 DOWN
; 和修复倒计时；舰上原有的跟随者样式血条保留。用的是游戏自己的 HUD 绘制，独占全屏也能看到。0 = 关闭
VehicleHud=1
; 最多同时显示几台（最近的优先，上限 12）
VehicleHudCount=6
; 只显示离玩家这么多米以内的（0 = 不限距离）
VehicleHudRange=500
; 插件所有 HUD（载具状态、战斗机 / 直升机 / 原版载具 HUD、瞄准标记、地图）的大小倍率。HUD 本身已按游戏画面大小缩放
; （与原版 HUD 同一基准：游戏画面高度 / 1080，分屏时按整个画面而不是半个视口），这里只是在此基础上再乘的个人微调。
; 范围 0.5 ~ 3.0，默认 1.0
HudScale=1.0
; 插件 HUD 文字的语言：auto = 跟随游戏「选项 → 语言」（韩文时显示英文）；en / zh-CN / zh-TW / ja = 固定为英文 / 简体中文 /
;     繁体中文 / 日文。武器型号、按键名和单位保留原文。默认 auto
HudLanguage=auto

; ---- 传送舰激光（需要场上有潜水母舰）----
; 潜水母舰在场时，传送舰（e508）每隔 30~45 秒会用传送口充能 12 秒：舰底射出一道红色瞄准光指向目标
; （玩家在舰 400 米内瞄玩家，否则瞄潜水母舰甲板），最后 1 秒锁定方向，然后沿锁定线射出一道粗主炮激光。
; 充能期间集火该舰，打掉它最大耐久的 CarrierLaserBreak（默认 15%）或击落它即可打断。同一时间只有一艘在充能。
; 需要安装器（或 python tools/make_jets.py）写入的 Mods/OBJECT/EDF6VC_PORTAL_SIGHT.SGO 与 EDF6VC_PORTAL_LASER.SGO；
; 文件不在时此功能自动关闭（日志里会说明）。0 = 关闭
CarrierLaser=1
; 主炮激光伤害
CarrierLaserDamage=2500
; 充能期间打掉多少比例的最大耐久算打断（0.15 = 15%）
CarrierLaserBreak=0.15

; ---- 原版物理修正（改完需重启游戏）----
; 车辆开过不平的地面被弹飞：原版把轮式载具车身的物理质量档设成「角色」，缺少运动焊接(motion welding)，
; 高速滑过地形三角面接缝时会撞上内侧棱边被弹起。开启后改用引擎给载具准备的「载具」档。0 = 保持原版
VehicleWelding=1
; 巨型单位（巴尔加、巨大怪物）被母体等动态物体顶飞或挤进地下：原版角色的垂直接触冲量上限是无穷大，
; maxForce 在这条路径上没生效。开启后按 5 代 hkp 的语义限制为 maxForce×帧时长，只作用于动态物体；
; 静态地形与关键帧物体仍是无限支撑。0 = 原版
GiantContactCap=1
; 血腥风暴这类分裂导弹（MissileBullet02）：原版按「到锁定点（目标唯一的中心骨骼）的距离」决定何时分裂，
; 遇到卵这种很大的目标，导弹在分裂前就撞上了表面。开启后改按「沿视线到目标表面的距离」判定，小目标不受影响。
; 联机时分裂由每台机器各自计算，建议所有玩家设成一样。0 = 原版
SplitMissileSurface=1
; 原版追踪弹（导弹、巡航导弹、血腥风暴、翼装兵追踪激光；玩家、NPC、敌人的都算）改用比例导引：算提前量飞向拦截点，不再绕圈。
; 每发弹的转弯能力、推力、导引延迟照它自己武器的原版数值。联机时每台机器各自计算，所有玩家设成一样。0 = 原版纯追踪
StockMissilePN=1
; 上面比例导引的导引常数（2~6，越大越早修正，3 是常用值）
StockMissileNav=3
; ---- 玩家战斗机 ----
; 测试场 / 空袭兵呼叫的「玩家战斗机 / 攻击机」（安装器生成，即 tools/make_jets.py、tools/call_weapons.py）：空着停在原地，
; 玩家用原版上车键坐进驾驶座后由插件按固定翼飞机飞（README「功能」里「玩家战斗机」一条有操作说明）。0 = 关闭（会变成乱飞的直升机）
PlayerJet=1
; 1 = 俯仰反向（右摇杆往后拉 = 机头向下；键鼠时鼠标往上 = 瞄准点往下）
PlayerJetInvertPitch=0
; 键鼠操作（手柄不受影响）：鼠标移动瞄准点（以地面为参照：左右 = 方位，上下 = 高低角），飞机自己压坡度、拉杆飞向它；
; W / 空格 = 拉起，S = 压低，A / D = 横滚（按住这些键时手动飞，松开后瞄准点停在机头方向）。
; 加力键 / 减速键：Windows 虚拟键码（十进制）；16 = Shift，17 = Ctrl，81 = Q，69 = E，0 = 不用
PlayerJetBoostKey=16
PlayerJetBrakeKey=17
; 切换挂载（导弹 / 炸弹；炮舰机还有 SHELLS / CANNON）的键，副射击发射当前选中的那种；82 = R。手柄固定为 LB。
; 坐炮舰机炮手座时，这个键在炮弹和侧舷机炮之间切换
PlayerJetSwitchKey=82
; 切换锁定目标的键：锁定机头锥内的下一个目标（离屏幕中心最近的优先，见 PlayerJetLockByView）；81 = Q。手柄固定为 X
PlayerJetTargetKey=81
; 在空中弃机（下飞机）弹射后，约 4 秒时另一架同型号飞机飞到你身边把你接进驾驶座（1 开，0 关）
PlayerJetCatch=1
; 1 = 键盘和鼠标都能飞：按 W/空格/S/A/D 时键盘飞（松开后继续按键盘方式飞、自动改平），一移动鼠标就交给鼠标瞄准点，
;     再按键又回到键盘；0 = 只用键盘飞，鼠标只管镜头。默认 1
PlayerJetMouseFlight=1
; 鼠标移动瞄准点的速度倍数（0.1~10，PlayerJetMouseFlight=1 时有效）
PlayerJetMouseSpeed=1.0
; 玩家驾驶的固定翼飞机的滚转快慢倍数（0.5~2，默认 1）。每种飞机按自己的机动性滚转（战斗机快、轰炸机和炮舰机慢），
; 机体和镜头始终跟得上；觉得大飞机滚得慢就调到 1.3~1.5
PlayerJetRollScale=1.0
; 鼠标瞄准点拉飞机转向的力度倍数（0.5~2，默认 1）。大则跟手、小则平稳
PlayerJetAimGain=1.0
; 呼叫来的战机进场时（第一次攻击之前，最多 15 秒）从喷口拖出白色尾烟，烟留在空中慢慢淡出（原版导弹尾烟的带状烟）。0 = 关闭。默认 1
JetEntrySmoke=1
; 撞击伤害倍数：玩家驾驶的飞机撞到东西（不含着陆、撞地、落水）时，按动能 ½·质量·接近速度² 算伤害（质量 = 机种空重 + 当前挂载，
; 接近速度 = 沿撞击方向被挡掉的速度；每 287 kJ 记 1 点，再乘本机的强度倍率），乘这个倍数后给撞击点附近
; （爆炸范围 = 机体尺寸的一半：战斗机约 8 米、攻击机约 12 米）的敌人，不伤友军。0 = 关闭；范围 0~100
PlayerJetRamDamage=1.0
; 热诱弹：按这个键放出一对热诱弹（虚拟键码，默认 0x58 = X），追着你的导弹每发有 75% 概率被骗走
PlayerJetFlareKey=0x58
; 每架飞机带几对热诱弹（0~99，默认 8）
PlayerJetFlares=8
; 1 = 驾驶插件飞机时用插件自己的机炮瞄准具（炮口方向十字、按弹速算的弹着圈、锁定目标的提前量标记），
;     并隐藏原版机炮那两条红色瞄准线；0 = 照原版显示红线、不画瞄准具
PlayerJetGunSight=1
; 1 = 驾驶插件飞机时显示飞行 HUD：速度矢量（飞行路径标记）、地平线和俯仰梯、顶部航向带、左右的速度 / 高度框
PlayerJetFlightHud=1
; 1 = 飞行 HUD 左下方显示雷达告警圆盘（RWR）：机头朝上，被敌机锁定（黄色 J）、导弹追来（红色 M，最近的一枚套菱形，标距离）
;     按相对机头的方位和远近画在圆盘上，越近越靠中心；有新导弹发射时圆盘闪红、显示 LAUNCH。在画面内的威胁另在它身上加标记
PlayerJetThreatHud=1
; 1 = 锁定（自动锁定和上面「切换锁定目标的键」）选离屏幕中心（视线方向）最近的目标，而不是离机头最近的；0 = 按机头
PlayerJetLockByView=1
; 1 = 你手里的原版锁定武器（步兵武器，或你坐的任何座位上的载具武器）也先锁离屏幕中心最近的目标，多重锁定先锁不同目标；
;     锁定时间、距离、锥角、保持时间照原版武器自己的数值。NPC 的锁定不变。0 = 原版顺序（锥里离得最近的）
PlayerLockByView=1
; 1 = 单机时空袭兵的 Tempest 巡航导弹出弹后切到导弹机头视角，鼠标 / 右摇杆操纵它（每帧最多转原版的转角），
;     左键 / RT 加速（按一次即生效，不可取消；撞上东西照常爆炸），Esc / B 交还激光引导（打开地图也会交还）。0 = 原版（追激光点）
;     联机暂不接管，继续按激光目标引导，避免只有本机改变航线和速度。
TempestTv=1
; 上面电视制导的鼠标灵敏度（0.1~5）
TempestTvMouseSpeed=1.0
; 上面电视制导按左键 / RT 加速后的极速倍数（1~10，原版极速的几倍；约半秒加满；转弯角速度不变，所以越快转弯半径越大）
TempestTvBoost=3
; 1 = 坐在 EDF6AutoTurret 的炮塔上（克卜勒、玻尔斯、坦克炮手座）时显示它的锁定框和预瞄圈（需要两个插件都装）；0 = 不显示
TurretAimHud=1

; 起落架收放键（虚拟键码，默认 0x47 = G）：在地面上（机轮承重）不能收起，起飞后才能收；放下时阻力大、速度会被压住，
; 超过 463 km/h（250 节，起落架限速）座舱会警告；没放下起落架就着陆 = 机腹迫降，按坠机算伤害。0 = 不用键盘收放
PlayerJetGearKey=0x47
; 手柄收放起落架的按键（座位按键位，0~255）：64 = 0x40 = 按下左摇杆（L3，默认）；1 A，2 B，4 X，8 Y，16 LB，32 RB（副射击），
; 128 R3；0 = 不用手柄收放
PlayerJetGearButton=64

; 插件的其它飞机也能开（1 开，0 关）：截击机、对地攻击机、多用途机、制空战斗机、被接管的轰炸机、炮舰机、空中航母（含自爆 / 人偶无人机母舰）、
; 无人机、自爆 / 人偶无人机，都按 NPC 自己的性能飞，各有自己的武器（README「玩家战斗机」里有逐机表）。敌方战斗机和 Primer 战斗机不能开。
; 在地面上或离地 12 米内、速度 8 m/s 以下时，用原版上车键上去（NPC 飞行员被挤下）；空中下机：喷气机自己飞回来接你，旋翼机交回 NPC
PlayerJetAll=1
; 呼叫键（虚拟键码，默认 0x48 = H；0 = 不用）：步行时按一下，最近的一架我方插件飞机降到你身边——旋翼机在旁边落地，
; 喷气机在附近找一段平地降落、滑跑停到你旁边；之后等你 90 秒，没上就回去继续执行原来的任务。再按一下换下一架
PlayerJetHailKey=0x48
; 炮舰机的两个座位（驾驶座 + 侧炮手座，README「炮舰机」）：0 = 上车键坐驾驶座（你来开，NPC 飞行员挪到炮手座替你自动开炮，默认），
; 1 = 上车键坐炮手座（NPC 继续驾驶、绕你瞄准的地方盘旋，你用镜头瞄准、按射击键开炮）
GunshipBoardGunner=0
; 按住这个键再按上车键，坐另一个座位（虚拟键码，默认 0x56 = V；0 = 不用）。只认键盘，手柄玩家用上面的 GunshipBoardGunner 选
GunshipGunnerKey=0x56

; 跳伞后在空中按这个键切掉降落伞（虚拟键码，默认 0x58 = X；和热诱弹同键，只认弹射之后重新按下的）
PlayerJetChuteCutKey=0x58

; ---- 载具撞击伤害 ----
; 1 = 有人驾驶（玩家或 NPC）的地面载具用车体 / 部件撞到敌人时造成伤害，和飞机的撞击同一公式：
; 伤害 = ½ · 部件带的质量 · 部件撞上去的速度² ÷ 287 kJ × 本车强度倍率 × VehicleRamDamage。速度是撞上去的那个部件自己的速度：
; 坦克 / 车 / 摩托是车头（倒车时车尾），机甲是脚（踩下去的速度）、巴尔加还有拳头。爆炸范围 = 那个部件的大小。不伤友军，本车照旧。
; 0 = 关闭
VehicleRam=1
; 载具撞击伤害倍数（0~100，默认 20；1.0 = 和飞机完全同一标准，但地面载具速度只有飞机的几分之一，按真实动能坦克 20 km/h 撞蚂蚁不到 1 点，
; 所以默认放大 20 倍：Blacker 60 km/h 约 160 点、Nix 冲刺一脚约 200 点、巴尔加一脚 1200~5000 点；嫌重就调小）
VehicleRamDamage=20

; ---- 钻头战车 ----
; 1 = 钻头战车的钻头由插件驱动：按住射击键加速旋转，接触到的敌人受伤，碰到的建筑和岩石被钻开；0 = 关闭（钻头不转、不造成伤害）
Drill=1
; 钻头最高转速（转/分），同时决定钻头看上去转多快；范围 30~1200，默认 300
DrillMaxRpm=300
; 按住射击键时，从静止加速到最高转速需要的秒数；范围 0.2~10
DrillSpinUpSec=1.8
; 松开射击键后，从最高转速停下需要的秒数；范围 0.2~20
DrillSpinDownSec=2.5
; 最高转速时，每秒对接触到的敌人造成的伤害（转速低时按比例减少，低于最高转速的 15% 不造成伤害）；范围 0~1000000
DrillDamage=2000
; 最高转速时，每秒从钻到的建筑 / 岩石耐久里扣掉多少（普通建筑耐久几百到一千多，岩石只有 1）；范围 0~1000000
DrillBreak=600
; 钻头热量：转动时升温（转速越高越快，钻到东西时再快一半），停转时降温，钻头每击杀一个敌人降一截（DrillKillCool）；
; 热量满 100% 即过热，钻头被强制停转、不造成伤害，直到冷却到下面的 DrillResumeHeat 才能再转。
; 屏幕下方转速条旁显示热量（过热时为红色并显示 OVERHEAT）。NPC 开的钻头战车同样受限。
; 最高转速空转时，从冷却到过热需要的秒数（钻到东西时约为它的 2/3）；范围 1~600，默认 30
; （旧键 DrillHeatSec 已停用：它默认 12 秒，过热太快；ini 里还留着也不再读取）
DrillOverheatSec=30
; 钻头每击杀一个敌人，热量降低多少（0~1，默认 0.1 = 降 10 个百分点；击杀 = 被钻头咬到后 1.5 秒内死亡的敌人）
DrillKillCool=0.1
; 钻头停转时，从过热冷却到 0% 需要的秒数（转得越慢降温越快）；范围 1~600，默认 8
DrillCoolSec=8
; 过热后，冷却到这个比例（0~0.95，默认 0.3 = 30%）才恢复，可以重新按射击键转动
DrillResumeHeat=0.3
; 1 = 钻头可以发射：按下发射键，钻头喷着火焰从车头飞出去，飞到最远处（或撞到建筑 / 地形）后像回旋镖一样飞回车头，
; 沿途咬伤碰到的敌人；0 = 关闭。过热时不能发射；飞行中钻头保持最高转速，照常升温
DrillLaunch=1
; 发射键（Windows 虚拟键码，默认 0x52 = R；0 = 不用键盘发射）
DrillLaunchKey=0x52
; 手柄发射键（座位按键位：0x08 = Y；0 = 不用手柄发射）
DrillLaunchButton=0x08
; 钻头飞出的最远距离（米）；范围 5~300，默认 60
DrillLaunchRange=60
; 钻头飞出的初速和飞回的最高速度（米/秒）：出去时逐渐减速、到最远处停住，回来时逐渐加速；范围 5~400，默认 70
DrillLaunchSpeed=70
; 飞行中每咬一口对敌人造成的伤害（贴着敌人时每 0.1 秒一口）；范围 0~1000000，默认 800
DrillLaunchDamage=800
; 每次发射增加的热量（0~1，默认 0.12 = 12 个百分点）
DrillLaunchHeat=0.12

; ---- EMC 蓄力光束 ----
; 1 = 玩家开 EMC（空袭兵的 EMC / EMCS / EMCX）时，按住射击键蓄力，蓄满自动射出一道粗光束（持续下面的 EmcBeamSec 秒）：
;     一发光束消耗原版一次连射的 1000 发弹药，伤害等于那 1000 发的总伤害，光束贯穿沿线所有敌人（每个都吃满这份伤害），
;     沿线建筑一起被摧毁，光束结束时在它照到的地面上爆出一个大范围爆炸。全部只伤敌方，不伤友军。地形不能被破坏（游戏的地形不可变形）。
;     蓄力中途松开射击键则不发射；射完需要松开射击键再按才能蓄下一发。NPC 开的 EMC 不变（原版连射）。
; 0 = 原版（按住射击键连射 1000 发）
EmcBeam=1
; 蓄满需要按住射击键的秒数；范围 0.5~10，默认 3
EmcChargeSec=3
; 光束持续的秒数；范围 0.5~5，默认 2.5
EmcBeamSec=2.5
; 光束结束时，终点处爆炸的半径（米）；范围 10~1000，默认 300
EmcBlastRadius=300
; 终点爆炸的伤害是光束伤害（一次连射的总伤害）的多少倍；范围 0~10，默认 1；0 = 不爆炸
EmcBlastShare=1
; 光束照射期间，每秒从沿线每栋建筑的耐久里扣掉多少（普通建筑耐久几百到一千多，默认一下就倒）；范围 0~10000000
EmcBreak=20000

; ---- 边三轮摩托 ----
; 1 = 边三轮摩托的边车可以坐人：边车上的人站在边车平台上、用自己的武器射击（插件把他保持在平台上），车身保持水平不压弯、不翻倒；
; 你坐边车而没人开车时，推左摇杆让车朝镜头方向开。0 = 关闭（边车只是外形，上车键只开摩托）。「保持水平」在游戏启动时装上，关闭要重启游戏
Sidecar=1
; 1 = 你开边三轮摩托时，附近的 NPC 队友坐进空着的边车替你射击（用他自己的武器）；0 = 不派
SidecarNpcGunner=1
; 坐进边车的 NPC 队友离摩托不超过多少米；范围 0~200，默认 25
SidecarNpcRange=25

; ---- 炮塔镜头（战争雷霆式：镜头先转，炮塔跟过去）----
; 1 = 开有炮塔的地面载具（坦克、Kepler、喀秋莎、自行榴弹炮、钻头战车、机甲……；直升机、战斗机除外）时，鼠标 / 右摇杆转的是镜头，
; 炮塔按这辆车原版的转速自己转向屏幕中心对着的地方（会下坠的炮按弹道抬高），没转到位时屏幕上有一个白色小方框标出炮口此刻
; 指着的位置；镜头放在车后上方、不会被车身挡住（往上看时镜头只仰起，不沉到车后）。0 = 原版（镜头跟着炮塔转）
DecoupledTurretCam=1
; 镜头转动速度：摇杆推满（或鼠标连续移动）时每秒转多少度，范围 10~720，默认 90；炮塔本来就更快的车按炮塔的速度
TurretCamRate=90
; 观察键：按住时只转镜头，炮塔守住原来瞄的地方（DecoupledTurretCam=0 时炮塔原地不动），屏幕上青色十字是炮塔守着的点；
; 松开后镜头转回原来的方向。虚拟键码，默认 0x04 = 鼠标中键；0 = 不用键盘
FreeLookKey=0x04
; 手柄观察键（座位按键位，0~255）：64 = 0x40 = 按下左摇杆（L3，默认）；1 A，2 B，4 X，8 Y，16 LB，32 RB，128 R3；0 = 不用手柄
FreeLookButton=64

; ---- 炮管稳定器 ----
; 1 = 该有稳定器的车（Blacker / Titan / 单座坦克 / E551 / Kepler 的主炮，Grape 的炮塔，坦克和机甲的炮手座）在颠簸、转弯时
; 炮管守住它在世界里瞄着的方向（高低和方向两个平面），转速不超过炮塔自己的最高速度，车身转得越快残余误差越大，车身转得比
; 炮塔还快时炮管被带着走、车停下后再追回来；原版载具 HUD 上显示 STAB（STAB LAG = 炮塔追不上车身）。火箭炮 / 喀秋莎 /
; 自行榴弹炮（停车射击）、钻头、摩托、机甲驾驶员的手臂、Depth Crawler、Maser、飞机没有。0 = 原版（炮管跟着车身晃）
GunStabilizer=1

; ---- 高视角 ----
; 1 = 开着下面 HighCamClass 包括的车时，按下面的键在「车辆视角」和「高视角」之间切换：高视角从车后上方往前下方看，
; 能看到火箭弹 / 炮弹落在哪一片（黄色十字和散布圈）；瞄准方式不变（屏幕中心对准的地面就是目标）。下车、关掉本项或插件、
; 换任务时自动换回车辆视角；同一个任务里换一辆车会沿用上一次的选择。0 = 关闭
HighCam=1
; 哪些车有高视角：1 = 间接射击的车（喀秋莎、自行榴弹炮）；2 = 再加上大车（镜头离车 17 米以上的：Titan、钻头战车、Proteus、
; 大型机甲、Maser……，默认）；3 = 所有有炮塔的车
HighCamClass=2
; 切换键（虚拟键码，默认 0x43 = C；0 = 不用键盘切换）
HighCamKey=0x43
; 手柄切换键（座位按键位，0~255）：128 = 0x80 = 按下右摇杆（R3，默认）；1 A，2 B，4 X，8 Y，16 LB，32 RB，64 L3；0 = 不用手柄切换
HighCamButton=128
; 弹着观察镜头在真实预测落点上方多少米；范围 10~200，默认 45（大车按车的大小放大）
HighCamHeight=45
; 弹着观察镜头在真实预测落点后方多少米；范围 0~200，默认 35（大车按车的大小放大）
HighCamBack=35
; 兼容旧配置保留；真实弹着观察的俯角由 HighCamHeight / HighCamBack 决定
HighCamPitch=40

; ---- 瞄具放大 ----
; 1 = 当前座位确有可用武器和瞄具才允许切换放大；无武器/燃料/未知弹种不开镜
; 间接火力、俯瞰及退出过渡不使用通用FOV放大；飞行/机甲保留自身HUD
SightZoom=1
; 切换键（虚拟键码，默认 0x5A = Z；0 = 不用键盘切换）
SightZoomKey=0x5A
; 手柄切换键（座位按键位，0~255）：128 = 0x80 = 按下右摇杆（R3，默认；高视角、沙扎比锁定优先，可另设不同按键）；1 A，2 B，4 X，8 Y，16 LB，
; 32 RB，64 L3；0 = 不用手柄切换
SightZoomButton=128

; ---- 地图（M 键）----
; 1 = 按 M（手柄 Back）打开地图：你的镜头升到头顶上空，游戏照常画出真实的地形、建筑、载具和敌人，像普通的 3D 地图一样平移、
; 转动、缩放（离地 200 米到 3 公里）；屏幕上叠加地面网格（线上标着离你多远、在你哪一边，北 = 地图的 +Z 方向）、指北针、比例尺、
; 你（白色圆圈和箭头）、队友（绿点）、友军载具（绿框）、飞机（青色菱形）、空中航母（青色双框）、敌人（红点，红色菱形是敌机）、
; 任务目标点（黄圈，标着离你多远）。地图打开时你的角色 / 载具不接受操作（游戏不暂停，照常进行），插件自己的按键也全部让开。
; 再按 M、按 Esc（游戏的暂停菜单也会照常打开）或手柄 B 关闭。
; 键鼠：按住左键拖动 / WASD / 方向键平移，按住右键拖动 / Q E 转向，R F 调俯角，滚轮 / + - / PageUp PageDown 缩放，空格（Home）回到你身上。
; 手柄：左摇杆平移，右摇杆转向 / 调俯角，RT 放大、LT 缩小，A 回到你身上。0 = 关闭
Map=1
; 打开 / 关闭地图的键（虚拟键码，默认 0x4D = M；0 = 不用键盘）
MapKey=0x4D
; 手柄打开 / 关闭地图的按键（XInput 按键位，0~65535；注意和其它 *Button 设置用的座位按键位不是一套）：32 = 0x20 = Back / View（默认）；
; 1 十字键上，2 十字键下，4 十字键左，8 十字键右，16 Start，64 L3，128 R3，256 LB，512 RB，4096 A，8192 B，16384 X，32768 Y；
; 几个加在一起 = 要同时按下（例如 LB + Back = 288）；游戏里 Back 另有用途时换一个组合；0 = 不用手柄
MapButton=32
; 地图打开时把视距（近景镜头的远裁剪面，见下面的 ViewDistance）临时抬到多少米，关闭后恢复原值；范围 1000~10000，默认 6000；0 = 不改
MapViewDistance=6000

; ---- 尼克斯（Nix）上下半身分离 ----
; 1 = 机甲战士式操作：W/S 前进后退、A/D 转下半身（腿），上半身（连同镜头和双臂的瞄准）只跟鼠标 / 右摇杆转，
; 腿转向时上半身在世界里保持朝向不动；上半身相对腿扭到原版的极限角时，就停在极限、跟着腿一起转（不会反过来推着腿转）。
; 只管玩家自己开的尼克斯（NPC 开的、联机里别人开的不变）。0 = 原版（上半身跟着腿一起转）
NixTorsoTwist=1

; ---- 原版载具：挂载切换、换座位 ----
; 原版载具的挂载（1 开，0 关，默认开）：1 时重新运行安装器选「安装」，安装器给原版载具的请求加上它们应有的挂载：
;   坦克（布莱克、瓦利乌斯）和格雷普装甲车：同轴机枪 + 炮射 AGM-114 反坦克导弹；艾普瑟隆电磁炮：AGM-114；泰坦驾驶员：AGM-114（和车头加特林同一个键）；
;   奈格林导弹车：AIM-120 防空导弹 + AGM-65 反坦克导弹 + Hydra 70 火箭巢；防空车（克卜勒、沃卢斯）：AIM-9X + AIM-120 防空导弹；
;   摩托（弗里德）：Hydra 70 火箭巢；直升机（N9 Eros 系列、602、Nereid）：Hydra 70 火箭巢 + AGM-114 地狱火 + AIM-9X。
; 新挂载和它旁边那件原版武器用同一个键开火：切换键（PlayerJetSwitchKey，默认 R；手柄 LB）在原版武器和这些挂载之间轮换，打空的自动跳过。
; 改回 0 再运行安装器就恢复原版请求。只改请求的副本，不动原版载具和武器表（装了 EDF6AutoTurret 时防空车的请求由它写入，挂载照样加上）；
; 联机时房间里每个人都要设成一样（没有这些文件的机器上同一个请求的武器表不同）。卸载插件前先改回 0 并运行安装器。
; 旧的 StockHeliStores=1（只给直升机）仍然算开
StockVehicleStores=1
; 载具内换座位（1 开，0 关）：坐在有多个座位的载具里（Brute 舱门炮、坦克炮手座、Proteus、救援车、炮舰机……）不用下车就能换座
SeatSwitch=1
; 换到下一个空座位的键（虚拟键码，默认 0x46 = F；0 = 不用）
SeatNextKey=0x46
; 数字键 1~9 直接换到那个座位（1 开，0 关）；那个座位上是 NPC 时和你对调（驾驶员去开炮、炮手来驾驶，同炮舰机）
SeatNumberKeys=1
; 手柄换到下一个空座位的按键（座位按键位，0~255）：2 = B（默认）；1 A，4 X，8 Y，16 LB，32 RB，64 L3，128 R3；0 = 不用手柄换座
SeatButton=2
; 离开驾驶座时由 NPC 接手驾驶（1 开，0 关）：原版直升机——NPC 飞行员上来继续飞（你在舱门炮位时它在附近找敌人打），不会掉下来；
; 坦克 / 泰坦 / 格雷普斯 / 卡车 / 救援车——NPC 司机上来，车停在原地、自己找敌人打，按 M 打开地图对这辆车下「守点」命令，NPC 就带着你开过去
SeatPilot=1
; 联机时也允许换座位（1 开，0 关，默认开：联机未实测；换座走原版上车同一条广播消息）
SeatSwitchOnline=1
; 坐在多座位载具里一直显示座位表（1 开，0 关）：屏幕下方一行列出每个座位是谁（你 / NPC / 有人 / 空）；
; 0 = 只在刚上车、刚换座、按住换座键时显示几秒。只是显示，SeatSwitch=0 或联机时也照样显示
SeatList=1

; ---- 普罗透斯（Proteus）重构 ----
; 1 = 你坐在普罗透斯（V614 / V407 大型步行机甲）里时，它改成「行走 = 快速转移的指挥平台，架设 = 保护友军的火力据点」：
;     两个座位（驾驶员 + 炮手）、两种姿态、原版空袭兵电磁碉堡的能量护盾、力场；武器全是原版的两门加农炮和导弹架
;     （见 README「普罗透斯」）；你下车后恢复原版。0 = 原版普罗透斯
ProteusRework=1
; 驾驶员的按键（键盘：虚拟键码，0 = 不用；手柄：座位按键位 1 A、2 B、4 X、8 Y、16 LB、32 RB、64 L3、128 R3，0 = 不用）
; 切换行走 / 架设：键盘 0x54 = T，手柄 32 = RB
ProteusModeKey=0x54
ProteusModeButton=32
; 开关护盾（原版电磁碉堡的能量墙，立在机体周围 120°：行走时朝车头，架设时朝驾驶员视线、有热量）：键盘 0x42 = B，手柄 16 = LB
ProteusShieldKey=0x42
ProteusShieldButton=16
; 架设时驾驶员发射原版导弹架（导弹座没人时；原版锁定、原版导弹）：键盘 0x02 = 鼠标右键；手柄固定用左扳机 LT
ProteusSalvoKey=0x02
; 1 = 两个座位：驾驶员（0 号座）和炮手（1 号座，两门原版加农炮一起转、一起开火）；右炮座和导弹座关闭（谁都坐不进去，原版派进去的
;     NPC 炮手会被请下车）。炮手座没人时驾驶员用主射击键开两门炮。0 = 保留原版四个座位（各座有人时各用各的；空座的武器照样由
;     驾驶员 / 炮手代用）
ProteusTwoSeats=1
; 行走：移速（和起步加速）是原版的几倍；范围 0.2~4，默认 1.6
ProteusWalkSpeed=1.6
; 行走：转向速度是原版的几倍；范围 0.2~4，默认 1.3
ProteusWalkTurn=1.3
; 行走：能直接迈上去的台阶高度（米）；原版约 1.2 米（脚下胶囊半径 5 米、最陡可走 40°），范围 0~4，默认 2.6（同时最陡可走约 61°）
ProteusStepHeight=2.6
; 行走时护盾打开，移速 / 转向乘这个系数；范围 0~1，默认 0.5
ProteusShieldSlow=0.5
; 行走：炮的射速倍数（<1 变慢）和散布倍数（>1 变散）；默认 0.7 / 1.8
ProteusWalkGunRate=0.7
ProteusWalkGunSpread=1.8
; 架设 / 收起的硬直（秒，期间不能走也不能转）；范围 0~10，默认各 1.5
ProteusDeploySec=1.5
ProteusStowSec=1.5
; 架设后原地转身的速度是原版的几倍（不能走）；范围 0~2，默认 0.4
ProteusDeployTurn=0.4
; 架设：炮的射速倍数和散布倍数；默认 1.8 / 0.35
ProteusDeployGunRate=1.8
ProteusDeployGunSpread=0.35
; 架设后镜头升高多少米（视野变大）；范围 0~60，默认 12
ProteusViewLift=12
; 架设时护盾的热量：立着从冷到过热要多少秒（热量只按时间涨）、从过热完全冷却要多少秒；过热或被打碎后，
; 冷却到 / 恢复到这个比例才能重新立起
ProteusHeatSec=12
ProteusCoolSec=6
ProteusResumeHeat=0.3
; 护盾（原版电磁碉堡墙）的耐久：普罗透斯最大耐久的几倍（0.3 = 30%；敌弹打在墙上扣它，扣光墙碎）；收起时从空到满要多少秒、
; 挨打后停多少秒才开始恢复
ProteusBarrier=0.3
ProteusBarrierRegenSec=40
ProteusBarrierDelaySec=4
; 架设时的力场半径（米，0 = 不展开）；范围 0~500，默认 60
ProteusFieldRadius=60
; 力场内友军（士兵和载具）受到的伤害减少多少（0.3 = 减 30%）；范围 0~0.95
ProteusFieldDefense=0.3
; 力场内士兵造成的伤害增加多少（0.2 = 加 20%）；范围 0~5
ProteusFieldAttack=0.2
; 力场内友军武器的射速倍数；范围 1~5，默认 1.2
ProteusFieldFireRate=1.2
; 力场内翼装兵每秒额外恢复最大能量的多少（0.05 = 5%）；范围 0~1
ProteusFieldEnergy=0.05
; 力场内空袭兵的支援武器每秒额外充能多少点（在阵营积分之外）；范围 0~10000，默认 25
ProteusFieldPower=25
; 行走中打开护盾时，己方 NPC 士兵和 EDF6AutoTurret 的自动炮塔优先攻击普罗透斯附近或正在攻击它的敌人：
; 这些敌人的距离按这个系数打折来比较（0.3 = 当作只有 30% 远；1 = 关闭）；范围 0.05~1
ProteusPriority=0.3
; ……「附近」指离普罗透斯多少米以内；范围 0~1000，默认 100
ProteusPriorityRadius=100

; 视距（米）：车辆、士兵、敌人在多远以内画出来。原版每关都是 1000；地形和大建筑另有远景，不受这一项影响。
; 1000~10000；0 = 用关卡自己的值。调高会稍降帧率，默认 3000
ViewDistance=3000

; ---- 大地图（实验） ----
; 物理世界边界（米）：0 = 原版的 ±3000；填 4096、6000、10000 等则放大到 ±这个值（改后要重启游戏）。
; 实验中：±10000 时停着的载具会穿过地面往下掉（2026-10-04 实测），怀疑是 Havok 的碰撞精度随边界变粗；
; 试不同的值看停着的飞机还会不会掉，找能用的最大值。日志 BIGWORLD 行记下地图碰撞件和它们建出的碰撞体数。
BigWorld=0
; ---- EDF5 战役 ----
; 安装器把 EDF5 本篇、DLC1、DLC2 做成 3 个独立任务包（tools/make_edf5_campaign.py），在离线模式的「任务包」里选。
; 它们的内容编号不是平台认识的 DLC，插件据此把这 3 个编号当作已拥有，任务包才能选（不然显示为「尚未购买」）。
; 由安装器写入（第一个任务包的内容编号，其余两个依次 +1），不用手改；0 = 没装 EDF5 战役。
EDF5CampaignContent=0
; 测试场：安装器把测试场做成独立任务包（离线、在线各一个模式，同一个内容编号），不再占用原版任务 RM015。
; 这个编号同样不是平台的 DLC，插件把它当作已拥有，任务包才能选。由安装器写入（测试场任务包的内容编号），不用手改；0 = 没装测试场。
TestRangeContent=0

; 地形共享：同一块地形摆放多次时（大地图的 3 x 3 平原），只解码一次、所有摆放共用（改后要重启游戏）。
; 1 = 开（大地图从约 16.7 GB 内存降下来，8 GB 内存的电脑也能进）；0 = 原版做法，每次摆放各解码一份。
TerrainShare=1

; ---- 喷气机音效 ----
; 1 = 插件的喷气机（AI 战机、无人机、炮舰机、玩家战机）带引擎声：飞得越快越响、音调越高，飞掠时有多普勒变调（docs/sound-re.md）。
; 引擎声由插件自己播放（机头方向听到涡轮尖啸、机尾方向听到轰鸣，远处变闷），音量跟随游戏的主音量和效果音量；
; 在本 DLL 旁边放 EDF6VehicleCrew_jet.wav（16 位 PCM）就改用这段录音
; 喷气机原有的直升机旋翼声已在安装器生成机体时去掉；导弹的发射声和飞行推进声由安装器生成的导弹武器文件（EDF6VC_<种类>_<数量>.SGO）提供
JetSound=1
; 引擎声音量倍数，乘在游戏的主音量 × 效果音量上；范围 0~4
JetSoundVolume=1.0

; ---- 座舱告警音 ----
; 1 = 玩家驾驶插件飞机、旋翼机或原版直升机时，告警有声音（插件自己播放）：PULL UP（近地警告，「呜—呜— Pull up」）、
;     TERRAIN / SINK RATE（近地提醒）、失速喇叭声 + 「Stall」、导弹发射时的双音颤音 + 「Missile」、起落架没放的「Too low, gear」。
;     被锁定的慢蜂鸣、导弹来袭的快蜂鸣、自己锁定目标的提示音不受这一项影响（一直都有）
; 0 = 只保留上面那三种蜂鸣
WarnAudio=1
; 1 = 语音告警用 Windows 自带的语音朗读（装了英文语音时优先用英文女声，没有就用系统默认语音）；
;     0 = 不用语音，PULL UP 只有「呜—呜—」两声、其余提醒是一声提示音。
; 在本 DLL 旁边放 EDF6VehicleCrew_warn_pullup.wav（或 _terrain / _sinkrate / _stall / _missile / _gear，16 位 PCM）就改用这段录音
WarnVoice=1
; 座舱告警音和锁定提示音的音量倍数，乘在游戏的主音量 × 效果音量上；范围 0~4
WarnVolume=1.0

; ---- 载具音效 ----
; 1 = 载具的声音由插件自己播放（docs/sound-re.md §9），替换原版的同类声音：
;     引擎声（坦克 / Kepler / 自行榴弹炮 / Titan / Maser 是 V12 柴油机，Grape / 卡车 / Naegling 是六缸柴油机，摩托 / 边三轮是 V 型双缸；
;     油门和车速越大转速越高，有人坐上驾驶座才启动；坦克另有随车速变快的履带声）、炮塔转动的伺服电机声（转得越快越响、越尖，
;     停下时「咔」一声；Begaruta / Nix 机甲的武装转动也是）、主炮装填（打完退壳落地叮当、快装好时推弹入膛、闭锁「咣」一声，
;     跟着原版武器的射击间隔 / 弹匣装填时间走）、更有力的主炮炮声（近处是炸裂声 + 低频重击 + 回声，远处是闷雷般的隆隆声，按距离延迟传到）、
;     机枪 / 加特林 / 防空炮的连射声（射击时一段循环、停火时一声回响，近处有弹壳落地声）、机炮 / 榴弹发射器的单发声、
;     导弹和火箭的发射声（直升机、插件飞机的机枪也换；插件飞机的导弹保留安装器生成的发射声；激光、光束、火焰、酸液保留原版）。
;     声音按镜头位置分左右声道、远处变小变闷、开过时有多普勒变调。
; 0 = 全部用原版的声音
; 在本 DLL 旁边放 EDF6VehicleCrew_veh_<名字>.wav（16 位 PCM）就改用这段录音，名字见 README「地面载具音效」
VehicleSound=1
; 各组音量倍数，乘在游戏的主音量 × 效果音量上；范围 0~4。某一组填 0 = 这一组保留原版的声音
; 引擎和履带
VehicleEngineVolume=1.0
; 炮塔转动
VehicleTurretVolume=1.0
; 装填（退壳、推弹、闭锁）
VehicleReloadVolume=1.0
; 主炮炮声
VehicleGunVolume=1.0
; 机枪、加特林、防空炮、机炮、榴弹发射器（连射声、单发声、弹壳声）
VehicleMgVolume=1.0
; 导弹、火箭的发射声
VehicleMissileVolume=1.0
; ---- 星导者生物（敌人）----
; 任务脚本 / 测试场用 CreateFriend 放置的星导者生物由插件接管（改到敌方队伍、插件驾驶），依赖 JetPilot=1：
;   百足龙虫（EDF6VC_CENTIPEDE）：单只贴地爬行、绕近玩家喷吐；附近的龙虫首尾相接合成一条长龙，两只以上就起飞，
;     在空中盘旋、俯冲，还能继续接长；中间被打掉一只就从那里断开。
;   蜻蜓空优机（EDF6VC_DRAGONFLY）：优先追打空中目标（友军战机、离地的玩家），按拦截航线从下后方突进，
;     腹部卷起对准后连射，再急转脱离。
; 0 = 关闭（场上的星导者生物会被删除）
Primer=1
; 耐久倍率：龙虫 400、蜻蜓 600 乘以它（0.05~100）
PrimerHpScale=1.0
; 0 = 不开火
PrimerFire=1
; 1 = 记录轨迹：每只每 0.1 秒一行写进 Mods/Plugins/EDF6VehicleCrew.primer.csv（位置、速度、状态、开火、合体关系、玩家位置），
; 用 python tools/primer_trace_view.py 画成轨迹图。测试用，平时 0
PrimerTrace=0
; 一条长龙最多由几节组成（一只龙虫就是一节，2~48）
CentipedeLinkMax=24
; 龙虫从多远去接别的龙的尾巴（米，10~2000）
CentipedeLinkRange=150
; 长龙被打断后，断口那一只在新头长出来之前（约 2.5 秒，它失控挣扎、不开火）受到的伤害倍数（1~20；1 = 不加）
CentipedeWoundDamage=3.0
; 星导者生物中弹溅出、死亡爆开的体液（原版巨蚁的酸液飞溅）大小倍率，0 = 不要（0~5）
PrimerBlood=1.0

; ---- 友军 NPC 士兵的自制 AI（docs/npc-ai-design.md）----
; 总开关。1 = 友军 NPC 士兵（游骑兵 / 翼骑兵 / 重装兵 / 空降兵）由插件接管：用武器真实射程交战、按距离和目标换枪、
; 不进玩家枪线、开火前查友军火线（弹道和爆炸范围里有友军或玩家就不开）、被围时后撤 / 侧移 / 翻滚、低血退到玩家身后。
; 任务脚本正在控制的 NPC（走路线、护送、原地待命、朝向指令）移动照旧由原版控制，插件只拦下会打到友军的射击，
; 不会让任务卡住。0 = 全部恢复原版 AI
CustomNpcAi=1
; 1 = NPC 不站进玩家的枪线（玩家镜头中心那条线）：在线内就横移出去，战位取在玩家两侧
NpcFireLane=1
; 枪线两侧各多宽算「在线内」（米，0.5~20）
NpcLaneWidth=2.5
; 枪线从玩家往前算多长（米，碰到地形或建筑就到那里为止；10~1000）
NpcLaneLength=150
; 战位偏离「玩家—目标」连线的角度（度，10~80）：越大越靠两侧
NpcFlankDeg=45
; 1 = 按目标距离和类型换武器（近距离霰弹、远距离长枪、对空用追踪、大型目标用爆炸，友军靠近目标时不用爆炸武器）
NpcWeaponSwitch=1
; 交战距离 = 最长武器真实射程的这个比例（0.2~1；原版是射程的一半、最少 25 米）
NpcEngageShare=0.85
; 1 = 被围时后撤、侧移、翻滚
NpcEvade=1
; 多近的敌人算在逼近（米，2~100）
NpcDangerRange=15
; 敌人近到这个距离就翻滚（不能翻滚的兵种后撤）（米，0.5~NpcDangerRange）
NpcGrabRange=4
; 周围敌人的压力（越近权重越大）达到这个值就后撤（0.2~20）
NpcCrowd=1.5
; 两次翻滚的最短间隔（秒，0.5~30）
NpcRollSec=2.5
; 血量低于这个比例时退到玩家身后（0~0.9；0 = 不退）
NpcRetreatHp=0.3
; 交战时离自己的锚点（跟随的玩家、所属队长、驻守点）最远多少米（5~500）
NpcLeash=40
; 运输（断剑式）：已配对卡车 / 运兵车 / 运输直升机的小队，移动 / 攻击移动 / 守点的目的地远于这个距离时自动上车、开过去、在目的地前下车（米，50~2000）
TransportAutoRange=200
; 1 = 小队队长阵亡后由剩下的人选出新队长（血量最多的接任，已被招募的仍跟着玩家），人数太少就并入附近有空位的小队；
; 0 = 原版（队员各自散开、单独行动）。联机时只在房主上做
NpcSquadSuccession=1
; 剩下的人少于这个数就并入别的小队（1~16；1 = 从不并队）
NpcSquadMin=2
; 并队后一支小队最多多少人（NpcSquadMin~32）
NpcSquadMax=8
; 只并入这么多米以内的小队（0~2000）
NpcSquadJoinRange=150
; ---- 指挥面板（地图视图里，docs/npc-ai-design.md §6）----
; 小队「驻守」到某点后，队员留在这个半径内（米，2~500）
NpcGuardRadius=15
; 自制 Q 标记（取代原版 Q / Spot，README「自制 Q 标记取代原版 Q」）：按这个键标记瞄准点附近的敌人（Windows 虚拟键码，
; 默认 81 = Q；0 = 关闭），再按一次同一个目标取消；附近没有敌人时标记地面上的那个点（并派地图里选中的单位过去）。
; 步行和坐载具都能用；瞄准点 = 鼠标所指（直升机 / 旋翼机鼠标瞄准飞行的 FLY 方框、战斗机的鼠标瞄准方框），其它情况为屏幕中心。
; 联机时标记同步给装了本插件的队友（他们的也显示在你这里，地图里也画）。
; 所有 NPC 在「武器射程 + 当前指令允许的移动范围」内时优先打它（需 CustomNpcAi=1）；地图里下「集中火力」（H）的小队无论远近都去打它。
NpcMarkKey=81
; 标记取瞄准点多少度以内的敌人（1~45）
NpcMarkCone=8
; 地点标记（没对准敌人时）保留多少秒（1~600）；敌人标记一直保留到它被打死或消失
QMarkPointSec=15
; Q 标记的提示音音量（0~2；0 = 静音）：自己标记上扬两声、队友标记下行三声、取消一声低音
QMarkVolume=0.8
; 原版 Q（Spot，地上的标记圈）：0 = 关闭（默认，由上面的自制 Q 取代；NpcMarkKey=0 关掉自制 Q 时原版照常），1 = 恢复原版（与自制 Q 同时生效）。
; 原版 Spot 所有玩家都能看到；自制 Q 只有装了本插件的队友能看到——和没装插件的人一起玩时可以设 1
VanillaSpot=0
; 跟着你的小队（招募的、没有地图指令的）没在交战时按什么编队行进，所有跟你的小队合成一个编队、你在编队的「尖兵」位置，
; 朝向 = 你最后走的方向（原地转身不变）。0 = 默认（原版跟随），1 纵队，2 交错纵队（双列），3 楔形，4 V 形（反楔形），5 横队，
; 6 左梯队，7 右梯队，8 菱形（四面），9 交替掩护（队伍分两半，一半前进到楔形位置、另一半原地掩护，到位或 8 秒后交换）。
; 有敌人时照常散开交战，打完回到编队；被墙挡住走不到位置的士兵 3 秒后暂时交给原版跟随（会绕路）
NpcFormation=0
; 步行时按这个键在上面的编队之间切换（Windows 虚拟键码，默认 84 = T；0 = 关闭；地图里选中小队按 T 也一样），
; 屏幕中间下方显示「编队：楔形 [T]」
NpcFormationKey=84
; 编队里士兵之间的距离（米，2~30）
NpcFormationSpacing=5
; 地图里下「警戒」（G）的小队在警戒点怎么布防：0 = 默认（在 NpcGuardRadius 范围内自由站位），10 环形防御（围成一圈、
; 第一人朝向你下令时看着警戒点的方向），5 横队（横在警戒点上、面向那个方向），3 楔形。地图里选中警戒中的小队按 T 切换
NpcGuardFormation=0
; 步行时按这个键让跟着你的小队（招募的、没有地图指令的）分散去捡你周围 NpcPickupRange 米内的道具箱：一人一个箱子、近的先配，
; 边跑边照常开火；捡完、超过 NpcPickupSec 秒或再按一次（召回）结束，回到编队。武器箱 / 护甲箱按游戏原版的方式记到本关成绩里
; （和你自己捡一样，联机也照常同步）。屏幕中间下方显示「拾取箱子：剩 N 个，已捡 M [Y] 召回」。Windows 虚拟键码，默认 89 = Y；0 = 关闭
NpcPickupKey=89
; 只捡离你多少米以内的箱子（10~300）
NpcPickupRange=80
; 一次最多捡多久（秒，10~600）
NpcPickupSec=90
; 1 = NPC 也去捡回复箱：只有没满血的 NPC 会去，捡到的回复给这个 NPC 自己（大箱 30%、小箱 15% 最大耐久）；满血的 NPC 不碰回复箱，
; 留给你。联机时 NPC 一律不捡回复箱（插件的回血不在联机同步里）。0 = 回复箱全部留给玩家（默认）。
; 这里只是默认值：游戏里打开地图（M）点「回复箱」按钮或按 O 随时切换，本次游戏一直有效
NpcPickupHealth=0
; 1 = 地图里可以命令小队上车（B：最近的、有空座位的友方载具，玩家正坐着的优先；优先驾驶席、实际有武器的炮手席、余下乘客席；没有真实士兵不造人）
; 和下车（N）；坐在坦克等车辆炮手座上的 NPC 士兵会自己瞄准开火（原版只给驾驶座的 AI 开火）。0 = 关闭
NpcBoarding=1
; 1 = 上了车的 NPC 会用自己座位的炮：坐炮手座的 NPC 士兵，以及被你顶下 / 和你换座挪到炮手座的 NPC 乘员（原版的 NPC 乘员
; 只在驾驶座开火，挪到炮手座后就一直不动）；Brute（410）的驾驶员是本机或远端玩家时，NPC 舱门炮手也会瞄准开火（用真实弹药，
; 打光不补）。空座不开火。单机/联机均可（含本地分屏）生效。0 = 关闭
; 联机：NPC 自身所属机器瞄准/开火，Dummy 乘员由房主负责；不接管任何玩家座位。
NpcGunners=1
; ---- 任务脚本的 NPC（docs/npc-ai-design.md §4）----
; 脚本控制期间（走路线、护送、原地待命、朝向指令）NPC 的移动和目标一律交给原版，保证任务流程（护送必须到达、剧情触发必须触发）。
; 脚本放手后（路线走完、被脚本解除跟随、原地待命解除）且 ScriptNpcSettleSec 秒内没再被脚本接管，这支小队就转为插件的普通单位，
; 出现在指挥面板里可以下令。1 = 同时允许玩家招募它（走近或在面板按 U）；0 = 保持任务原来的设定（有些任务的小队本来不可招募）
ScriptNpcRecruit=1
; 脚本放手后等多少秒才算真正结束（0~600；避免把脚本两条指令之间的空档当成结束）
ScriptNpcSettleSec=5
; 小队「自由交战」时，以下令时所在位置为中心追击多远的敌人（米，10~2000）
NpcFreeRange=120
; 解除招募后，这支小队要过多少秒才能再次被招募（0~3600；冷却期间走近也不会加入）
NpcRecruitCooldownSec=60

; ---- NPC 坦克回位（docs/npc-ai-design.md §8）----
; 1 = NPC 驾驶的坦克 / 泰坦 / 格雷普斯被主炮后坐力或撞击推离驻守点后，自己开回去（驻守点 = 地图指挥给的点；
; 没有就是出生点）。走任务路线的车、正在追敌人的车由原版控制，不受影响。联机时只在房主上生效。0 = 原版（推开就停在原地）
; 需要 CustomNpcAi=1
TankReturnToPost=1
; 偏离驻守点多少米才开回去（1~100）
TankPostHold=6
; 驻守点在车身后方且不超过这么多米时直接倒车回去，否则掉头开回去（米，0~200）
TankReverseMax=30

; ---- 局内切换空袭呼叫 ----
; 任务中按键切换「空袭兵呼叫武器叫来什么」：第一项是按各武器原样，其余每项是一种插件呼叫（不含玩家喷气机请求），
; 单机、联机均可用；只改变本机玩家的呼叫，远端玩家按武器原样。选择本身不会同步给其他机器。
; 选中后任何一把 EDF6VC 呼叫武器开火都叫来选中的那种。切换时游戏窗口上方会显示当前选择（独占全屏时看不到，但照样生效）。
; 值是 Windows 虚拟键码（0~255），0 = 关闭该键；游戏中改了照样生效。221 = ]（下一个），219 = [（上一个）
CallNextKey=221
CallPrevKey=219

; ---- 直升机飞控参数（一般不用动；飞得晃/上下起伏/冲过头时再调）----
; 水平：每偏离目标点 1 米给多少摇杆量（大=更急）
HeliMoveGain=0.04
; 水平：每 1 m/s 速度给多少反向摇杆（大=刹得更稳，太大会肉）
HeliBrakeGain=0.12
; 高度：爬升速度误差 1 m/s 对应多少油门（上下起伏就调小）
HeliClimbGain=0.08
; 高度：学习悬停油门的速度（长期偏高/偏低就调大）
HeliHoverLearn=0.03

; ---------------------------------------------------------------- 沙扎比（MSN-04）
; 空袭兵的「沙扎比」载具请求叫来的机动战士（全高 25.6 米），玩家坐进去由插件驾驶：
; 左摇杆 / WASD 走（推一半走、推满跑），右摇杆 / 鼠标左右转身、上下调整瞄准高低；
; 上升键（LT / 空格）在地上是推进器起跳、空中是爬升和悬停；冲刺键（手柄 A / 下面的键）沿移动方向冲刺。
; 推进剂：空中推进和冲刺消耗，落地恢复。没人驾驶时它站着等你，插件不派 NPC 驾驶。
; 0 = 关闭（请求来的沙扎比按原版直升机的方式处理，不建议）
Sazabi=1
; 速度（米/秒）：走、跑、空中飞行、推进冲刺（按住冲刺键持续冲刺）
SazabiWalk=12
SazabiRun=26
SazabiFly=48
SazabiDash=60
; 上升键按满时的爬升速度（米/秒）；关掉推进器后的下落加速度（米/秒²）
SazabiClimb=24
SazabiGravity=20
; 右摇杆推满时的转身速度（度/秒）；鼠标每单位移动转多少度（转身和瞄准共用）
SazabiTurn=110
SazabiMouseTurn=0.6
; 推进剂：满格能持续推进冲刺或爬升的秒数；在地面上每秒恢复满格的多少（0.4 = 2.5 秒回满，刚落地 1 秒内三倍）。
; 空中把推进剂用光会「过热」：不能再冲刺、爬升，自由落下，落地冷却约 0.6 秒后才恢复
SazabiThrusterSec=8
SazabiThrusterRegen=0.4
; 1 = 瞄准的上下反过来
SazabiInvertAim=0
; 辅助瞄准：准星周围 SazabiAssistCone 度、SazabiAssistRange 米以内看得见的敌人，离准星最近的那个被「吸住」：
; 光束步枪、粒子炮都打向它（准星上会出现锁定框）。选中的敌人在准星附近会一直保持，不会在两个敌人之间来回跳。
; SazabiAssistPull：镜头每秒向目标靠拢的比例（手柄锁定手感；0 = 只吸子弹不拉镜头）；
; 键鼠默认不拉镜头（SazabiAssistMousePull=1 也拉）。0 = 关闭辅助瞄准
SazabiAimAssist=1
SazabiAssistCone=8
SazabiAssistRange=600
SazabiAssistPull=4
SazabiAssistMousePull=0
; 锁定（只狼式）：按一下锁定准星 25 度内最近的敌人，镜头和机体朝向一直跟住它（键鼠和手柄都一样），准星变成红色锁定框；
; 锁定中推右摇杆 / 甩鼠标切换到左边或右边的下一个敌人；再按一次解除，目标死亡、跑出射程或被挡住 1.5 秒自动解除。
; 键盘 / 鼠标虚拟键码（4 = 鼠标中键），手柄按键位（128 = 按下右摇杆 R3）；0 = 不用
SazabiLockKey=4
SazabiLockButton=128
; 键鼠：冲刺键、空中加速下落键（Windows 虚拟键码，十进制；16 = Shift，17 = Ctrl，0 = 不用）
SazabiDashKey=16
SazabiDescendKey=17
; 武器：主射击 = 光束步枪；副射击 = 当前选中的特殊武器（护盾飞弹 / 浮游炮 / 胸部扩散米加粒子炮：按住蓄力、松开发射）。
; 按键：键盘是虚拟键码（0 = 不用），手柄是座位按键位（1 A、2 B、4 X、8 Y、16 LB、32 RB、64 L3、128 R3，0 = 不用）
; 切换特殊武器：键盘 0x52 = R，手柄 16 = LB
SazabiSwitchKey=0x52
SazabiSwitchButton=16
; 挥光束战斧（挥砍中再按一次接下一刀）：键盘 0x56 = V，手柄 4 = X
SazabiMeleeKey=0x56
SazabiMeleeButton=4
; 按住举盾：键盘 0x42 = B，手柄 32 = RB；举盾时来自正面的伤害只剩 SazabiGuardShare（0.25 = 四分之一）
SazabiGuardKey=0x42
SazabiGuardButton=32
SazabiGuardShare=0.25
; 伤害：战斧每次砍中每个敌人；米加粒子炮满蓄力时每道光束每一发（一道 90 发，共 5 道扇形光束，蓄力越少越弱）；浮游炮每一发（一次 6 发）
SazabiAxeDamage=12000
SazabiCannonDamage=300
SazabiFunnelDamage=500
; 测试用（testrange/run_test.py）：1 = 进关约 6 秒后自动把步行的玩家送进第一台空着的沙扎比；平时保持 0
SazabiTestBoard=0
; Tests only (tests/autopilot drive.py): 1 / 2 / 3 asks a container airdrop of the tank / APC / truck once a mission,
; 40 m from the player towards the map's middle, and puts the player into the vehicle it brings. 0: off.
AirdropTest=0
; ---- 地图支援（M 地图呼叫）：战斗外配置，保存后下一次呼叫生效；安装器菜单 7 可交互修改 ----
; 不可呼叫的支援单位（逗号分隔，留空 = 全部可呼叫）。单位名：INTERCEPTOR INTERCEPTOR_F STRIKE STRIKE_F MULTIROLE MULTIROLE_F
; FIGHTER FIGHTER_F CARRIER CARRIER_F HELI HELI_F BLAST_CARRIER BLAST_CARRIER_F DOLL_CARRIER DOLL_CARRIER_F SUB GUNSHIP GUNSHIP_F
; MEDIC_HELI MEDIC_HELI_F SQUAD PLATOON TANK_CREWED TANK_DELIVERY TRANSPORT_CREWED TRANSPORT_DELIVERY TRUCK_CREWED TRUCK_DELIVERY
SupportDisabled=
; 支援兵员的武器（原版 Ranger NPC 模板自带的 AI 武器）：rifle 步枪 / flame 火焰 / rocket 火箭 / shotgun 霰弹 / sniper 狙击
; 4 人小队队员、所有小队的队长、12 人大队三个小队的队员（正好三个，逗号分隔）、车辆机组、飞机机组
SupportSquadWeapon=rifle
SupportSquadLeaderWeapon=rifle
SupportPlatoonWeapons=rifle,rocket,sniper
SupportVehicleCrewWeapon=rifle
SupportAircraftCrewWeapon=rifle
; 一次呼叫来几架（0 = 该呼叫默认架数，最多 8；连同真实机组不超过 16 个单位，超出按上限）。例：SupportAircraftCount_FIGHTER=2
; 非法值保留默认，并在日志（CONFIG support ... INVALID）和第一次呼叫的提示里写明是哪一项
; 游戏外预设（安装器菜单 7 → l 编辑；格式见 docs/feature-2026-10-09-loadout-editor.md），呼叫时套用：
; SupportPreset_<单位>=兵种[@主色[:副色]][*人数],...  按座位顺序，每 4 人第一位是队长；不写或留空 = 该单位默认兵员。
;   单位：SQUAD PLATOON SQUAD_HELI PLATOON_HELI SQUAD_AIRDROP PLATOON_AIRDROP（最多 12 人）、TRANSPORT_CREWED TRUCK_CREWED（4 名乘客）
;   兵种：rifle flame rocket shotgun sniper（游骑兵）、lance laser monster izuna thunderbow（翼人）、
;         cannon midcannon pilebanker fshotgun（重装）。都是原版 AI 兵的武器；玩家武器表里的武器不能给 NPC。
;   颜色：RRGGBB 十六进制，X = 保留原色。例：SupportPreset_PLATOON_HELI=lance@1E3A8A*4,cannon*4,rifle*4
; SupportVehicle_<单位>=战前配置载具每个挂点的武器（不写或留空 = 原版挂载）：
;   坦克（TANK_CREWED TANK_DELIVERY）：第一项是主炮 HE（105mm 榴弹炮）或 AP（90mm 滑膛炮），之后每项一个挂点，
;     可挂 AP / HE / GLM（炮射导弹），最多 4 个。例（同一辆坦克一半 AP 一半 HE）：SupportVehicle_TANK_CREWED=HE,AP:25
;   战机（STRIKE FIGHTER INTERCEPTOR MULTIROLE，加 _F 是跟随版）：机炮总在，每项一个挂点，最多 5 个，可挂
;     AAM_S AAM_M AAM_L（空空）、AGM AGM_L（空地）、MK82（炸弹）、RKT（火箭巢）；GUNS = 只带机炮。
;     例（全带炸弹）：SupportVehicle_FIGHTER=MK82:6,MK82:6  （全带导弹）：SupportVehicle_STRIKE=AGM:6,AAM_S:2
;   数量可选 1 2 3 4 5 6 8 10 12 15 19 20 25 30 38 40。
; 带颜色的士兵、配了挂载的载具要用安装器生成的文件（菜单 7 保存或选 1 安装时生成，需关闭游戏）。联机时房主的预设
;   在全员都有对应文件时生效；有人缺少时本次按原版出动，缺的文件名记在对方的 EDF6VehicleCrew.variants_pending.txt，
;   对方退出游戏后运行安装器菜单 7 保存一次（或选 1）就会生成。
