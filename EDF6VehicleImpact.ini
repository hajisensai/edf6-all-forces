[VehicleImpact]
; Saved edits apply on the next punch; no game restart needed.
Enabled=1
; 0 = NPC-driven Balams trigger too, 1 = only player-driven
PlayerOnly=0
; Blast damage = punch damage x DamageScale
DamageScale=0.5
; Blast radius in metres (AmmoExplosion). The fireball grows with it.
Explosion=30
; Bullet class and its Ammo_CustomParameter (floats)
; Default copies the tank's timed-fuse grenade so it bursts where it spawns.
Bullet=GrenadeBullet01
CustomParameter=1.0,-0.004,1.0,0.8,0.05,20.0
Size=2.0
Speed=0
AliveFrames=2
Color=1.0,1.0,1.0,1.0
; Minimum gap between blasts from one vehicle
CooldownMs=250
