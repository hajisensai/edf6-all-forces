[VehicleImpact]
; Saved edits apply on the next punch; no game restart needed.
Enabled=1
; 0 = NPC-driven Balams trigger too, 1 = only player-driven
PlayerOnly=0
; Blast damage = punch damage x DamageScale
DamageScale=0.5
; Blast radius in metres (AmmoExplosion). The fireball grows with it.
Explosion=30
; Bullet class (must not need an AmmoModel: Grenade/Bomb/Missile bullets are refused)
; and its Ammo_CustomParameter floats (empty = empty array, what most weapons carry).
Bullet=SolidExpBullet01
CustomParameter=
; The round starts Lift metres above the hit point and flies straight down at Speed
; metres/frame, so it strikes the punched target (or the ground under it) and explodes.
Lift=3
Speed=3
AliveFrames=8
Size=2.0
Color=1.0,1.0,1.0,1.0
; Minimum gap between blasts from one vehicle
CooldownMs=250
