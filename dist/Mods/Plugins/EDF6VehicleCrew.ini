; EDF6VehicleCrew 设置。游戏运行中改完保存，约 1 秒内自动生效（不用重启）。
; 日志：同目录 EDF6VehicleCrew.log
[VehicleCrew]
; 总开关
Enabled=1
; 1 = 日志里每 5 秒打印每台载具的座位状态、每秒打印直升机飞控数据（测试期请保持 1）
Debug=1

; ---- NPC 自动上车 ----
; 1 = 己方空载具会自动来一名 NPC 驾驶（与任务脚本让 NPC 坦克队出动用的是同一个游戏原生调用）
AutoCrew=1
; 载具空着多少毫秒后才派 NPC（玩家刚下车/刚把 NPC 顶下来时也重新计时）
CrewDelayMs=3000
; 只给离玩家这么多米以内的载具派 NPC；0 = 不限距离
CrewRange=600

; ---- 玩家顶替 NPC ----
; 1 = 玩家可以上 NPC 正坐着的座位（提示照常出现，按上车键就顶掉）
Bump=1
; 1 = 被顶下的 NPC 挪到空的副座/炮手位；没有空位才下车（下车的 NPC 会消失）
BumpToGunner=1

; ---- 直升机驾驶 ----
; 游戏本身没有直升机驾驶 AI，NPC 坐上直升机后由本插件来飞。只接管本插件派了 NPC 的直升机。
HeliPilot=1
; 悬停在玩家头顶多高（米）
HeliHeight=35
; 没敌人时：玩家站着，直升机以这个半径（米）绕玩家盘旋，多架按 360°/架数均匀分布；
; 玩家在走动，直升机在玩家行进方向的侧前方这么远处排 V 字护航
HeliFollow=45
; 攻击这个距离内的敌人（米）。打法是扫射航线：在目标上方 HeliFireHeight 米全速冲过去，160 米内（506 是 150 米）
; 压机头瞄准开火、靠惯性滑进去；机头要压过 30° 时从目标旁边冲过去，飞出 140 米再转回来下一轮。
; 火线会穿过玩家时绕着目标横移开。409 的机炮在炮塔上，70 米内对下方的敌人自己就开火；409 的火箭弹是直射的，
; 只在机头对准（3°）时、250 米内发射；506 的导弹会追踪。弹药打空后过一会儿自动补满（机炮 8 秒、导弹/火箭 15 秒），
; 机炮每次连射 2 秒歇 1 秒
HeliRange=350
; 有敌人时的活动范围（米）：玩家步行时，交战的直升机离玩家不超过这么远（没敌人时的范围就是上面的 HeliFollow）。
; 只去打从这个圈里够得着的敌人（本圈半径 + 机枪射程以内）。玩家自己开直升机时不受限
HeliCombatRange=120
; 1 = 开火（机枪对准就打；不会隔着玩家开火）
HeliFire=1
; 1 = 也发射导弹
HeliMissile=1
; 两发导弹最短间隔（毫秒）
HeliMissileMs=4000
; 机头（含俯仰）偏离目标提前量点多少度以内才开火（近距离按目标处 3 米脱靶量自动放宽）。导弹会追踪，偏 10 度内就发
HeliFireCone=4
; 扫射时在目标上方多少米。越高越早到 30° 脱离、每轮开火越短；地图有高楼时调高
HeliFireHeight=25
; 避障：用游戏自己的地图射线检测地形和建筑（不检测敌人和友军）。前方有墙会减速、往空的一侧绕、爬到楼顶以上，
; 始终离地至少 6 米（降落除外）。1 = 开，0 = 关
HeliAvoid=1
; 0（默认）= 从不自己降落：附近没有敌人时，玩家站着它就绕玩家盘旋，玩家走动它就护航跟随。
; 设成毫秒数则打开降落：玩家原地站这么久、且玩家周围 HeliRange 米内也已这么久没有敌人时，降落到玩家身边约
; 20 米处（方便走过去把 NPC 顶下来自己开）；落地后玩家在 25 米内它就不起飞，有敌人靠近立刻起飞。
HeliLandMs=0

; ---- 直升机性能（插件驾驶的直升机）----
; 满杆速度（米/秒）。原版 Eros 约 17-18，Nereid、Brute 更慢。0 或低于原版 = 用原版速度
HeliSpeed=25
; 加速到满速的快慢（秒，越小越灵活）。原版约 13 秒
HeliAgility=4
; 最低转向速度（度/秒）。原版 Eros 40、Nereid 23、Brute 15；比这个慢的会被提到这个值
HeliYawRate=50
; Brute（410）的左右门炮由插件自动瞄准、开火，炮手座位没人也会打；玩家坐的那门炮仍归玩家
HeliDoorGuns=1
; 守点直升机（空袭兵「守点」呼叫来的 Brute）绕呼叫标记盘旋的半径（米），机头沿圆周、门炮朝内；
; 多架守同一点时在圆上均匀错开。交战时 Brute 的盘旋圆心移向目标（目标落在圆内半径一半处，门炮够得着），
; 打完回到标记上空继续绕；506/409 守点时仍是扫射航线，打完回到盘旋。0 = 旧行为：悬停在标记上空
HeliGuardRadius=120
; 守点盘旋速度（米/秒），最多取满杆速度的 80%
HeliGuardSpeed=12

; ---- 战斗机（测试场 / 空袭接管生成的 edf6tr_jet_* 飞机）----
; 由插件驾驶战斗机：巡逻、俯冲扫射、导弹、空战
JetPilot=1
; 燃料：升空多少秒后返航撤离（弹药打光或血量低于 25% 也会撤离）
JetFuelSec=120
; ---- 空袭接管（需要先运行 tools/make_jets.py 生成战斗机 SGO；没有它就保持原版）----
; 空袭兵呼叫轰炸机类支援时，改派插件驾驶的真战斗机（能被击落）；
; 空袭兵的呼叫武器（tools/call_weapons.py 安装的 EDF6VC_CALL_*）也靠这项生效，关掉就照原版 KM6 轰炸机来
JetAirRaider=1
; 任务脚本里的低空扫射飞机（RM034、M116、M118 等）换成真战斗机
JetMissionStrike=1
; 空袭派来的战斗机在场多少秒后返航
JetSortieSec=60

; ---- 地面载具（深渊爬行者 502；格雷普斯装甲车只需上面的 AutoCrew，原版自带 AI）----
; 深渊爬行者原版没有 AI，NPC 坐上去不会动；开启后由插件驾驶：没敌人时跟随玩家，有敌人时转身、逼近、开火
GroundPilot=1
; 没有敌人时停在离玩家多少米处
GroundFollow=20
; 多远以内的敌人会去打（米）
GroundRange=200
; 有玩家可跟时，离玩家最多多少米（追敌人也不超过这个距离）
GroundLeash=100
; 是否自动开火（机炮和左右臂炮）
GroundFire=1

; ---- 海上救援（需要场上有潜水母舰）----
; 玩家步行落海（高度低于 RescueBelow 持续 1.5 秒）时，从最近的潜水母舰甲板上空放出一架布鲁特（410）来接：
; 飞到玩家身边，降到让侧门座位正好在玩家头顶，悬停等待。玩家自己按上车键坐进侧门座位后，
; 运回潜水母舰甲板上空约 8 米悬停，玩家自己跳下去即可，跳下后直升机自行离开。
; 插件绝不移动玩家：不瞬移、不写坐标、不从远处把人拉进座位；上车只走游戏原版的上车判定和距离。
; 同一时间最多一架；120 秒内没人上车、玩家自己上岸或上了别的载具会取消，30 秒后可再次触发。
; 需要 EDF6VC_HELI_410.SGO 已安装且本关预载；没有潜水母舰时不救援（日志里会说明）
SeaRescue=1
; 玩家高度低于多少算落海（米，海面约为 0）
RescueBelow=-5.0
; 侧门座位到达原版上车距离内时，是否由插件替玩家按上车键（走原版上车流程，只会坐空着的侧门座位，
; 距离不够时不会上车）。0 = 关闭，悬停等玩家自己按上车键（默认）
RescueAutoBoard=0

; ---- 潜水母舰：船体 + 子系统 ----
; 潜舰 HP 拆成「船体」和 4 个甲板子系统（左舷炮塔 A、炮塔 B 各 6000，导弹舱 5000，艉部无人机舱 5000）。
; 打在子系统附近甲板上的伤害只扣该子系统；子系统打坏后失去功能（炮塔停火 / 导弹停射 / 不再放无人机），
; 90 秒后船员修好回满。每个子系统在自己位置上方有一条小血条，船体血条仍在指挥塔上方。
; 船体只吃重型攻击：母舰主炮（Genocide）和运兵船的传送门激光；其它攻击打在船体上一律不掉血。
; 船体 HP（出生时按比例抬到这个值；0 = 用 SGO 的 30000）
SubHullHp=100000
; 认不出来源时的兜底：打在船体上的单发伤害达到这个值也算重型攻击（0 = 只认母舰主炮和运兵船）
SubHeavyHit=1500

; ---- 载具状态显示（HUD）----
; 离玩家 VehicleHudRange 米以内、由 NPC 驾驶的友军载具（直升机、喷气机、无人机、空母、爬行者等），取最近的
; VehicleHudCount 台，在它头顶显示一行状态和一条血条：「机种 血量%  G 机炮余弹  M 导弹余数  D 剩余无人机出击
; F 剩余燃料(分:秒)」。没有该武器的不显示对应项；燃料只对插件限时的显示（喷气机、呼叫来的直升机），撤离时显示 RTB。
; 潜水母舰另在屏幕右侧显示自己的面板（深蓝底、青色边）：船体大血条和数值，4 个子系统各一条，被打坏时显示 DOWN
; 和修复倒计时；舰上原有的跟随者样式血条保留。用的是游戏自己的 HUD 绘制，独占全屏也能看到。0 = 关闭
VehicleHud=1
; 最多同时显示几台（最近的优先，上限 12）
VehicleHudCount=6
; 只显示离玩家这么多米以内的（0 = 不限距离）
VehicleHudRange=500

; ---- 传送舰激光（需要场上有潜水母舰）----
; 潜水母舰在场时，传送舰（e508）每隔 30~45 秒会用传送口充能 12 秒：舰底射出一道红色瞄准光指向目标
; （玩家在舰 400 米内瞄玩家，否则瞄潜水母舰甲板），最后 1 秒锁定方向，然后沿锁定线射出一道粗主炮激光。
; 充能期间集火该舰，打掉它最大耐久的 CarrierLaserBreak（默认 15%）或击落它即可打断。同一时间只有一艘在充能。
; 需要先运行 python tools/make_jets.py 写入 Mods/OBJECT/EDF6VC_PORTAL_SIGHT.SGO 与 EDF6VC_PORTAL_LASER.SGO；
; 文件不在时此功能自动关闭（日志里会说明）。0 = 关闭
CarrierLaser=1
; 主炮激光伤害
CarrierLaserDamage=2500
; 充能期间打掉多少比例的最大耐久算打断（0.15 = 15%）
CarrierLaserBreak=0.15

; ---- 局内切换空袭呼叫 ----
; 任务中按键切换「空袭兵呼叫武器叫来什么」：第一项是按各武器原样，其余是 17 种呼叫，选中后任何一把
; EDF6VC 呼叫武器开火都叫来选中的那种。切换时游戏窗口上方会显示当前选择（独占全屏时看不到，但照样生效）。
; 值是 Windows 虚拟键码，0 = 关闭。221 = ]（下一个），219 = [（上一个）
CallNextKey=221
CallPrevKey=219

; ---- 直升机飞控参数（一般不用动；飞得晃/上下起伏/冲过头时再调）----
; 水平：每偏离目标点 1 米给多少摇杆量（大=更急）
HeliMoveGain=0.04
; 水平：每 1 m/s 速度给多少反向摇杆（大=刹得更稳，太大会肉）
HeliBrakeGain=0.12
; 高度：爬升速度误差 1 m/s 对应多少油门（上下起伏就调小）
HeliClimbGain=0.08
; 高度：学习悬停油门的速度（长期偏高/偏低就调大）
HeliHoverLearn=0.03
