<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>剧情大纲 · EDF 全军出击</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wide">
  <header class="top">
    <h1>EDF 全军出击 · 剧情大纲</h1>
    <nav aria-label="页面"><a href="/">测试</a> · <b aria-current="page">剧情大纲</b> · <a href="/story.html">关卡策划</a></nav>
    <span class="me"><span id="me"></span> · <a id="auth" href="/logout">退出</a></span>
  </header>
  <p id="error" class="err hide" role="alert"></p>
  <div id="groupBar" class="row hide bar"><span>查看哪个组</span><fieldset id="group" class="chips" aria-label="查看哪个组"></fieldset></div>
  <div id="bookBar" class="row hide bar"><span>这个组的大纲</span><fieldset id="books" class="chips" aria-label="这个组的大纲"></fieldset>
    <button class="btn ghost small hide" id="newBook" type="button">＋ 新建一份大纲</button></div>
  <div id="draftBar" class="banner row hide" role="status"></div>
  <section class="olHead">
    <div class="row">
      <h2 id="title" class="olTitle">剧情大纲</h2>
      <input type="text" id="titleInput" class="hide olTitleInput" maxlength="60" placeholder="大纲名称" aria-label="大纲名称">
      <span class="grow"></span>
      <span class="row tight olActs">
        <button class="btn ghost small hide" id="undo" type="button" title="Ctrl+Z" aria-label="撤销">↶ 撤销</button>
        <button class="btn ghost small hide" id="redo" type="button" title="Ctrl+Y" aria-label="重做">↷ 重做</button>
        <button class="btn ghost small hide" id="addLane" type="button">＋ 新世界线</button>
        <button class="btn ghost small" id="copy" type="button">复制为文字</button>
        <button class="btn ghost small hide" id="edit" type="button" aria-pressed="false">编辑</button>
        <button class="btn small hide" id="save" type="button" title="Ctrl+S">保存</button>
      </span>
    </div>
    <p class="muted small" id="saved" role="status"></p>
    <div id="problem" class="stProblem hide" role="alert"></div>
    <p class="muted small hide" id="hint">点任意一步就地修改 · 拖 ⠿ 或 <kbd>Alt</kbd>+方向键 移到别的位置、别的线 · <kbd>Delete</kbd> 删除选中的一步 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销 · <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存 · 打字即存本机草稿 · 同组成员都能改 <button class="btn ghost small danger hide" id="removeBook" type="button">删除这份大纲</button></p>
    <div id="mapBox" class="olMapBox hide">
      <div class="row"><h3 class="olMapTitle">世界线总图</h3><span id="mapInfo" class="muted small"></span></div>
      <div id="map" class="olMapScroll"></div>
      <p class="muted small">箭头表示哪条线接到哪条线；圆点是每一步，实心的已经写了关卡。点方框跳到那条线。</p>
    </div>
  </section>
  <div id="board" aria-live="polite">加载中……</div>
</main>
<script src="/ui.js"></script>
<script src="/groups.js"></script>
<script src="/outline.js"></script>
</body>
</html>
