<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>关卡策划 · EDF 全军出击</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="wide">
  <header class="top">
    <h1>EDF 全军出击 · 关卡策划</h1>
    <nav aria-label="页面"><a href="/">测试</a> · <a href="/outline.html">剧情大纲</a> · <b aria-current="page">关卡策划</b> · <a href="/design.html">设定集</a></nav>
    <span class="me"><span id="me"></span> · <a id="auth" href="/logout">退出</a></span>
  </header>
  <p id="error" class="err hide" role="alert"></p>
  <div id="groupBar" class="row hide bar"><span>查看哪个组</span><fieldset id="group" class="chips" aria-label="查看哪个组"></fieldset></div>
  <div id="draftBar" class="banner hide" role="status"></div>
  <section class="stTop">
    <div class="row stHeadRow">
      <h2>关卡</h2>
      <span id="count" class="muted" role="status"></span>
      <span class="grow"></span>
      <button class="btn" id="add" type="button">＋ 新增关卡</button>
    </div>
    <p class="muted">「剧情大纲」写世界线上发生什么；这里按游玩顺序写每一关怎么打：目标、敌人、剧情演出、借用哪张原版地图、怎样接到下一关。谁都能看；同组成员都能编辑（这个组的大纲对所有账号开放时，有账号的都能编辑，删除仍限本组）。</p>
    <div class="row tools">
      <div class="seg" id="views" role="group" aria-label="排列方式">
        <button type="button" data-view="order" aria-pressed="true">按顺序</button>
        <button type="button" data-view="lane" aria-pressed="false">按世界线</button>
      </div>
      <input type="search" id="filter" placeholder="搜索关卡名、剧情、敌人、地图……（按 / 跳到这里）" aria-label="搜索关卡">
    </div>
    <fieldset id="stats" class="chips hide" aria-label="按状态筛选"></fieldset>
    <div class="stBarWrap hide" role="img"><div id="bar" class="stProgress"></div></div>
    <p id="hint" class="muted small hide">点关卡展开就地编辑，打字即存本机草稿 · <kbd>Ctrl</kbd>+<kbd>S</kbd> 保存 · <kbd>Esc</kbd> 收起 · 拖左侧 ⠿ 或 <kbd>Alt</kbd>+<kbd>↑</kbd>/<kbd>↓</kbd> 调顺序 · <kbd>Ctrl</kbd>+<kbd>Z</kbd> 撤销移动和删除</p>
  </section>
  <div id="story">加载中……</div>
  <datalist id="maps"></datalist>
</main>
<script src="/ui.js"></script>
<script src="/groups.js"></script>
<script src="/story.js"></script>
</body>
</html>
